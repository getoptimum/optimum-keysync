[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimum-keysync"
version = "0.1.0"
description = "Reconcile customer-owned Ethereum validator indices against Optimum's billing registry. Cron-friendly CLI that authenticates with an ovi_live_* operator API key, diffs the desired set against the registry, and applies the delta."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Optimum" }]
keywords = ["ethereum", "validator", "optimum", "billing", "sync", "operator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "httpx>=0.27,<0.29",
    "pydantic>=2.6,<3.0",
    "click>=8.1,<9.0",
    "structlog>=24.1,<26.0",
    "tenacity>=8.2,<10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "respx>=0.21,<0.23",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
]

[project.scripts]
keysync = "optimum_keysync.cli:main"

[project.urls]
Homepage = "https://github.com/getoptimum/optimum-customer-key-import"
Issues = "https://github.com/getoptimum/optimum-customer-key-import/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
optimum_keysync = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

# click decorators are typed loosely upstream and produce a wall of
# untyped-decorator noise on every command function. The cli module is
# orchestration — the type-critical logic lives in reconcile / config /
# billing_client which are still strict-typed.
[[tool.mypy.overrides]]
module = "optimum_keysync.cli"
disallow_untyped_decorators = false
disallow_untyped_defs = false
disallow_untyped_calls = false
